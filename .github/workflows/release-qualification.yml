name: Product Qualification

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      cargo_ai_sha:
        description: Exact Cargo AI commit to qualify (defaults to the triggering commit)
        required: false
        type: string
      baseline_cargo_ai_sha:
        description: Optional exact last product-qualified Cargo AI commit
        required: false
        type: string
      openai_model:
        required: false
        type: string
      anthropic_model:
        required: false
        type: string
      gemini_model:
        required: false
        type: string
      xai_model:
        required: false
        type: string
      mistral_model:
        required: false
        type: string
permissions:
  actions: read
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    name: Deterministic family
    uses: ./.github/workflows/multi-os-ci.yml
    with:
      cargo_ai_sha: ${{ inputs.cargo_ai_sha || github.sha }}
      emit_summary: false
      collect_all: true

  packages:
    name: Source-package family
    uses: ./.github/workflows/package-qualification.yml
    with:
      cargo_ai_sha: ${{ inputs.cargo_ai_sha || github.sha }}
      baseline_cargo_ai_sha: ${{ inputs.baseline_cargo_ai_sha }}
      emit_summary: false

  official_package:
    name: Official-package family
    uses: ./.github/workflows/package-qualification.yml
    with:
      official_package: true
      cargo_ai_sha: ${{ inputs.cargo_ai_sha || github.sha }}
      baseline_cargo_ai_sha: ${{ inputs.baseline_cargo_ai_sha }}
      emit_summary: false

  live_openai:
    name: Live OpenAI conformance
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative OpenAI check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai_model || vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo "OPENAI_API_KEY is required" >&2; exit 1; }
          [[ -n "${OPENAI_MODEL:-}" ]] || { echo "OPENAI_MODEL is required" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe openai

  live_anthropic:
    name: Live Anthropic conformance
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Anthropic check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model || vars.ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo "ANTHROPIC_API_KEY is required" >&2; exit 1; }
          [[ -n "${ANTHROPIC_MODEL:-}" ]] || { echo "ANTHROPIC_MODEL is required" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe anthropic

  live_gemini:
    name: Live Gemini conformance
    if: ${{ vars.LIVE_GEMINI_ENABLED != '' && vars.LIVE_GEMINI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate Gemini enrollment
        shell: bash
        env:
          PROVIDER_ENABLED: ${{ vars.LIVE_GEMINI_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_ENABLED" == "true" ]] || { echo "LIVE_GEMINI_ENABLED must equal true" >&2; exit 1; }
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Gemini check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model || vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${GEMINI_API_KEY:-}" ]] || { echo "GEMINI_API_KEY is required for enrolled Gemini" >&2; exit 1; }
          [[ -n "${GEMINI_MODEL:-}" ]] || { echo "GEMINI_MODEL is required for enrolled Gemini" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe gemini

  live_xai:
    name: Live xAI conformance
    if: ${{ vars.LIVE_XAI_ENABLED != '' && vars.LIVE_XAI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate xAI enrollment
        shell: bash
        env:
          PROVIDER_ENABLED: ${{ vars.LIVE_XAI_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_ENABLED" == "true" ]] || { echo "LIVE_XAI_ENABLED must equal true" >&2; exit 1; }
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative xAI check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ inputs.xai_model || vars.XAI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${XAI_API_KEY:-}" ]] || { echo "XAI_API_KEY is required for enrolled xAI" >&2; exit 1; }
          [[ -n "${XAI_MODEL:-}" ]] || { echo "XAI_MODEL is required for enrolled xAI" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe xai

  live_mistral:
    name: Live Mistral conformance
    if: ${{ vars.LIVE_MISTRAL_ENABLED != '' && vars.LIVE_MISTRAL_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate Mistral enrollment
        shell: bash
        env:
          PROVIDER_ENABLED: ${{ vars.LIVE_MISTRAL_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_ENABLED" == "true" ]] || { echo "LIVE_MISTRAL_ENABLED must equal true" >&2; exit 1; }
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Mistral check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ inputs.mistral_model || vars.MISTRAL_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${MISTRAL_API_KEY:-}" ]] || { echo "MISTRAL_API_KEY is required for enrolled Mistral" >&2; exit 1; }
          [[ -n "${MISTRAL_MODEL:-}" ]] || { echo "MISTRAL_MODEL is required for enrolled Mistral" >&2; exit 1; }
          cargo run --locked --example qualification-gate -- probe mistral

  summary:
    name: Product qualification summary
    if: ${{ always() }}
    needs: [deterministic, packages, official_package, live_openai, live_anthropic, live_gemini, live_xai, live_mistral]
    runs-on: ubuntu-latest
    environment: release-qualification
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate qualification metadata
        id: candidate_metadata
        continue-on-error: true
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          path: qualification-dashboard-source
          persist-credentials: false

      - name: Set up Rust for the qualification helper
        if: ${{ always() }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02

      - name: Render and enforce qualification dashboard
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_PROBE_RECORDS: ${{ toJSON(needs) }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
          OFFICIAL_PACKAGE_RESULT: ${{ needs.official_package.result }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
          CATALOG_CHECKOUT_OUTCOME: ${{ steps.candidate_metadata.outcome }}
          CATALOG_PATH: qualification-dashboard-source/.github/package-qualification-catalog.toml
          LIVE_GEMINI_ENABLED: ${{ vars.LIVE_GEMINI_ENABLED }}
          LIVE_XAI_ENABLED: ${{ vars.LIVE_XAI_ENABLED }}
          LIVE_MISTRAL_ENABLED: ${{ vars.LIVE_MISTRAL_ENABLED }}
        run: |
          set -uo pipefail
          jobs_json="$RUNNER_TEMP/release-qualification-jobs.json"
          jobs_api_status=1
          for attempt in 1 2 3 4 5; do
            if gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
              > "$jobs_json"
            then
              jobs_api_status=0
              expected_jobs=(
                "Deterministic qualification (ubuntu-latest)"
                "Deterministic qualification (macos-latest)"
                "Deterministic qualification (windows-latest)"
                "Source package qualification (ubuntu-latest)"
                "Source package qualification (macos-latest)"
                "Source package qualification (windows-latest)"
                "Official package qualification (ubuntu-latest)"
                "Official package qualification (macos-latest)"
                "Official package qualification (windows-latest)"
                "Live OpenAI conformance"
                "Live Anthropic conformance"
                "Live Gemini conformance"
                "Live xAI conformance"
                "Live Mistral conformance"
              )
              jobs_ready=true
              for expected_job in "${expected_jobs[@]}"; do
                if ! jq -e --arg suffix "$expected_job" \
                  '[.jobs[] | select(.name | endswith($suffix))] | length >= 1' \
                  "$jobs_json" > /dev/null
                then
                  jobs_ready=false
                  break
                fi
              done
              if [[ "$jobs_ready" == "true" ]]; then
                break
              fi
            else
              jobs_api_status=$?
            fi
            if [[ "$attempt" != "5" ]]; then sleep 2; fi
          done
          export JOBS_JSON="$jobs_json"
          export JOBS_API_STATUS="$jobs_api_status"

          env -u GH_TOKEN cargo run --locked --manifest-path qualification-dashboard-source/Cargo.toml --example qualification-gate -- aggregate
