name: Product Qualification

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      cargo_ai_sha:
        description: Exact Cargo AI commit to qualify (defaults to the triggering commit)
        required: false
        type: string
      baseline_cargo_ai_sha:
        description: Optional exact last product-qualified Cargo AI commit
        required: false
        type: string
      openai_model:
        required: false
        type: string
      anthropic_model:
        required: false
        type: string
      gemini_model:
        required: false
        type: string
      xai_model:
        required: false
        type: string
      mistral_model:
        required: false
        type: string
permissions:
  actions: read
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic:
    name: Deterministic family
    uses: ./.github/workflows/multi-os-ci.yml
    with:
      cargo_ai_sha: ${{ inputs.cargo_ai_sha || github.sha }}
      emit_summary: false
      collect_all: true

  packages:
    name: Source-package family
    uses: ./.github/workflows/package-qualification.yml
    with:
      cargo_ai_sha: ${{ inputs.cargo_ai_sha || github.sha }}
      baseline_cargo_ai_sha: ${{ inputs.baseline_cargo_ai_sha }}
      emit_summary: false

  live_openai:
    name: Live OpenAI conformance
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative OpenAI check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai_model || vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo "OPENAI_API_KEY is required" >&2; exit 1; }
          [[ -n "${OPENAI_MODEL:-}" ]] || { echo "OPENAI_MODEL is required" >&2; exit 1; }
          python3 .github/scripts/qualification_policy.py openai

  live_anthropic:
    name: Live Anthropic conformance
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Anthropic check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model || vars.ANTHROPIC_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo "ANTHROPIC_API_KEY is required" >&2; exit 1; }
          [[ -n "${ANTHROPIC_MODEL:-}" ]] || { echo "ANTHROPIC_MODEL is required" >&2; exit 1; }
          python3 .github/scripts/qualification_policy.py anthropic

  live_gemini:
    name: Live Gemini conformance
    if: ${{ vars.LIVE_GEMINI_ENABLED != '' && vars.LIVE_GEMINI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate Gemini enrollment
        shell: bash
        env:
          PROVIDER_ENABLED: ${{ vars.LIVE_GEMINI_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_ENABLED" == "true" ]] || { echo "LIVE_GEMINI_ENABLED must equal true" >&2; exit 1; }
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Gemini check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model || vars.GEMINI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${GEMINI_API_KEY:-}" ]] || { echo "GEMINI_API_KEY is required for enrolled Gemini" >&2; exit 1; }
          [[ -n "${GEMINI_MODEL:-}" ]] || { echo "GEMINI_MODEL is required for enrolled Gemini" >&2; exit 1; }
          python3 .github/scripts/qualification_policy.py gemini

  live_xai:
    name: Live xAI conformance
    if: ${{ vars.LIVE_XAI_ENABLED != '' && vars.LIVE_XAI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate xAI enrollment
        shell: bash
        env:
          PROVIDER_ENABLED: ${{ vars.LIVE_XAI_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_ENABLED" == "true" ]] || { echo "LIVE_XAI_ENABLED must equal true" >&2; exit 1; }
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative xAI check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ inputs.xai_model || vars.XAI_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${XAI_API_KEY:-}" ]] || { echo "XAI_API_KEY is required for enrolled xAI" >&2; exit 1; }
          [[ -n "${XAI_MODEL:-}" ]] || { echo "XAI_MODEL is required for enrolled xAI" >&2; exit 1; }
          python3 .github/scripts/qualification_policy.py xai

  live_mistral:
    name: Live Mistral conformance
    if: ${{ vars.LIVE_MISTRAL_ENABLED != '' && vars.LIVE_MISTRAL_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    environment: live-provider-ci
    timeout-minutes: 15
    outputs:
      evidence: ${{ steps.probe.outputs.evidence }}
    steps:
      - name: Validate Mistral enrollment
        shell: bash
        env:
          PROVIDER_ENABLED: ${{ vars.LIVE_MISTRAL_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$PROVIDER_ENABLED" == "true" ]] || { echo "LIVE_MISTRAL_ENABLED must equal true" >&2; exit 1; }
      - name: Validate exact trusted Cargo AI candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CARGO_AI_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$CARGO_AI_SHA" != "$TRUSTED_TRIGGER_SHA" ]]; then
            comparison=$(gh api "/repos/$GITHUB_REPOSITORY/compare/$CARGO_AI_SHA...$TRUSTED_TRIGGER_SHA" --jq .status)
            [[ "$comparison" == "ahead" ]]
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, resolved 2026-08-02
      - name: Configure isolated Cargo AI Home
        shell: bash
        run: echo "CARGO_AI_HOME=$RUNNER_TEMP/cargo-ai-home" >> "$GITHUB_ENV"
      - name: Run one representative Mistral check
        id: probe
        env:
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ inputs.mistral_model || vars.MISTRAL_MODEL }}
        run: |
          set -euo pipefail
          [[ -n "${MISTRAL_API_KEY:-}" ]] || { echo "MISTRAL_API_KEY is required for enrolled Mistral" >&2; exit 1; }
          [[ -n "${MISTRAL_MODEL:-}" ]] || { echo "MISTRAL_MODEL is required for enrolled Mistral" >&2; exit 1; }
          python3 .github/scripts/qualification_policy.py mistral

  summary:
    name: Product qualification summary
    if: ${{ always() }}
    needs: [deterministic, packages, live_openai, live_anthropic, live_gemini, live_xai, live_mistral]
    runs-on: ubuntu-latest
    environment: release-qualification
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate qualification metadata
        id: candidate_metadata
        continue-on-error: true
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.cargo_ai_sha || github.sha }}
          path: qualification-dashboard-source
          persist-credentials: false

      - name: Render and enforce qualification dashboard
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_PROBE_RECORDS: ${{ toJSON(needs) }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
          CARGO_AI_SHA: ${{ inputs.cargo_ai_sha || github.sha }}
          TRUSTED_TRIGGER_SHA: ${{ github.sha }}
          CATALOG_CHECKOUT_OUTCOME: ${{ steps.candidate_metadata.outcome }}
          CATALOG_PATH: qualification-dashboard-source/.github/package-qualification-catalog.toml
          LIVE_GEMINI_ENABLED: ${{ vars.LIVE_GEMINI_ENABLED }}
          LIVE_XAI_ENABLED: ${{ vars.LIVE_XAI_ENABLED }}
          LIVE_MISTRAL_ENABLED: ${{ vars.LIVE_MISTRAL_ENABLED }}
        run: |
          set -uo pipefail
          jobs_json="$RUNNER_TEMP/release-qualification-jobs.json"
          jobs_api_status=1
          for attempt in 1 2 3 4 5; do
            if gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
              > "$jobs_json"
            then
              jobs_api_status=0
              expected_jobs=(
                "Deterministic qualification (ubuntu-latest)"
                "Deterministic qualification (macos-latest)"
                "Deterministic qualification (windows-latest)"
                "Source package qualification (ubuntu-latest)"
                "Source package qualification (macos-latest)"
                "Source package qualification (windows-latest)"
                "Live OpenAI conformance"
                "Live Anthropic conformance"
                "Live Gemini conformance"
                "Live xAI conformance"
                "Live Mistral conformance"
              )
              jobs_ready=true
              for expected_job in "${expected_jobs[@]}"; do
                if ! jq -e --arg suffix "$expected_job" \
                  '[.jobs[] | select(.name | endswith($suffix))] | length >= 1' \
                  "$jobs_json" > /dev/null
                then
                  jobs_ready=false
                  break
                fi
              done
              if [[ "$jobs_ready" == "true" ]]; then
                break
              fi
            else
              jobs_api_status=$?
            fi
            if [[ "$attempt" != "5" ]]; then sleep 2; fi
          done
          export JOBS_JSON="$jobs_json"
          export JOBS_API_STATUS="$jobs_api_status"

          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, str(Path("qualification-dashboard-source/.github/scripts").resolve()))
          from qualification_policy import EvidenceError, summary_providers

          SHA_PATTERN = re.compile(r"[0-9a-f]{40}")
          REPOSITORY_PATTERN = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+")
          FAILING_CONCLUSIONS = {
              "action_required",
              "failure",
              "neutral",
              "stale",
              "startup_failure",
              "timed_out",
          }
          STATUS_LABELS = {
              "pass": "✅ pass",
              "fail": "❌ fail",
              "cancelled": "🚫 cancelled",
              "skipped": "⏭️ skipped",
              "not_configured": "⚪ not configured",
              "missing": "❓ missing",
              "unverified": "⚠️ not verified — rate limited",
          }

          OPTIONAL_PROVIDER_FLAGS = {
              "Gemini": "LIVE_GEMINI_ENABLED",
              "xAI": "LIVE_XAI_ENABLED",
              "Mistral": "LIVE_MISTRAL_ENABLED",
          }

          def table_cell(value):
              return str(value).replace("|", r"\|").replace("\r", " ").replace("\n", "<br>")

          def trusted_job_url(value):
              prefix = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/job/"
              return value if isinstance(value, str) and value.startswith(prefix) else run_url

          def aggregate_jobs(expected):
              selected = []
              for label, suffix in expected:
                  matches = [
                      job
                      for job in jobs
                      if str(job.get("name", "")).endswith(suffix)
                      and job.get("head_sha") == trigger_sha
                      and isinstance(job.get("run_attempt"), int)
                      and 1 <= job["run_attempt"] <= current_attempt
                  ]
                  if not matches:
                      return {
                          "status": "missing",
                          "completed": "—",
                          "evidence": f"[Workflow run]({run_url})",
                      }
                  latest_attempt = max(job["run_attempt"] for job in matches)
                  latest_matches = [job for job in matches if job["run_attempt"] == latest_attempt]
                  if len(latest_matches) != 1:
                      return {
                          "status": "missing",
                          "completed": "—",
                          "evidence": f"[Workflow run]({run_url})",
                      }
                  selected.append((label, latest_matches[0]))

              conclusions = []
              for _, job in selected:
                  if job.get("status") != "completed" or not job.get("conclusion"):
                      return {
                          "status": "missing",
                          "completed": "—",
                          "evidence": f"[Workflow run]({run_url})",
                      }
                  conclusions.append(job["conclusion"])

              known_conclusions = FAILING_CONCLUSIONS | {"cancelled", "skipped", "success"}
              if any(conclusion not in known_conclusions for conclusion in conclusions):
                  status = "missing"
              elif any(conclusion in FAILING_CONCLUSIONS for conclusion in conclusions):
                  status = "fail"
              elif any(conclusion == "cancelled" for conclusion in conclusions):
                  status = "cancelled"
              elif any(conclusion == "skipped" for conclusion in conclusions):
                  status = "skipped"
              elif all(conclusion == "success" for conclusion in conclusions):
                  status = "pass"
              else:
                  status = "missing"

              completed_values = [job.get("completed_at") for _, job in selected if job.get("completed_at")]
              completed = max(completed_values) if completed_values else "—"
              evidence = " · ".join(
                  f"[{label}]({trusted_job_url(job.get('html_url'))})" for label, job in selected
              )
              return {"status": status, "completed": completed, "evidence": evidence, "run_attempt": max(job["run_attempt"] for _, job in selected)}

          def read_catalog():
              if os.environ.get("CATALOG_CHECKOUT_OUTCOME") != "success":
                  raise ValueError("candidate metadata checkout did not succeed")
              catalog = tomllib.loads(Path(os.environ["CATALOG_PATH"]).read_text(encoding="utf-8"))
              if catalog.get("schema_version") != 1:
                  raise ValueError("unsupported catalog schema")
              official_packages = catalog.get("official_packages", [])
              official_count = catalog.get("official_package_count")
              if not isinstance(official_count, int) or official_count < 0:
                  raise ValueError("invalid official package count")
              if official_count != len(official_packages):
                  raise ValueError("official package count mismatch")
              canaries = [
                  row
                  for row in catalog.get("qualification_canaries", [])
                  if row.get("enabled") and row.get("release_required")
              ]
              if len(canaries) != 1:
                  raise ValueError("expected one release-required qualification canary")
              canary = canaries[0]
              repository = canary.get("repository", "")
              revision = canary.get("revision", "")
              platforms = canary.get("platforms", [])
              if not REPOSITORY_PATTERN.fullmatch(repository):
                  raise ValueError("invalid canary repository")
              if not SHA_PATTERN.fullmatch(revision):
                  raise ValueError("invalid canary revision")
              if not isinstance(platforms, list) or not 1 <= len(platforms) <= 3:
                  raise ValueError("invalid canary platforms")
              return repository, revision, len(platforms), official_count

          repository = os.environ["GITHUB_REPOSITORY"]
          run_url = f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          current_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          candidate = os.environ.get("CARGO_AI_SHA", "").strip()
          candidate_valid = bool(SHA_PATTERN.fullmatch(candidate))
          trigger_sha = os.environ.get("TRUSTED_TRIGGER_SHA", "").strip()
          trigger_valid = bool(SHA_PATTERN.fullmatch(trigger_sha))
          candidate_display = f"`{candidate}`" if candidate_valid else "invalid or missing exact commit"
          candidate_url = f"https://github.com/{repository}/commit/{candidate}" if candidate_valid else run_url
          generated_at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          jobs = []
          jobs_api_ok = os.environ.get("JOBS_API_STATUS") == "0"
          if jobs_api_ok:
              try:
                  payload = json.loads(Path(os.environ["JOBS_JSON"]).read_text(encoding="utf-8"))
                  jobs = payload.get("jobs", [])
                  jobs_api_ok = isinstance(jobs, list)
              except (OSError, ValueError, TypeError):
                  jobs_api_ok = False
                  jobs = []

          deterministic = aggregate_jobs(
              [
                  ("Ubuntu", "Deterministic qualification (ubuntu-latest)"),
                  ("macOS", "Deterministic qualification (macos-latest)"),
                  ("Windows", "Deterministic qualification (windows-latest)"),
              ]
          )
          package = aggregate_jobs(
              [
                  ("Ubuntu", "Source package qualification (ubuntu-latest)"),
                  ("macOS", "Source package qualification (macos-latest)"),
                  ("Windows", "Source package qualification (windows-latest)"),
              ]
          )
          provider_jobs = {
              "OpenAI": aggregate_jobs([("OpenAI job", "Live OpenAI conformance")]),
              "Anthropic": aggregate_jobs([("Anthropic job", "Live Anthropic conformance")]),
              "Gemini": aggregate_jobs([("Gemini job", "Live Gemini conformance")]),
              "xAI": aggregate_jobs([("xAI job", "Live xAI conformance")]),
              "Mistral": aggregate_jobs([("Mistral job", "Live Mistral conformance")]),
          }
          provider_rows = []
          provider_configuration_ok = True
          provider_results_ok = False
          try:
              needs_records = json.loads(os.environ["PROVIDER_PROBE_RECORDS"])
              records = {provider.lower(): needs_records[f"live_{provider.lower()}"]["outputs"].get("evidence", "") for provider in provider_jobs}
              for provider, result in provider_jobs.items():
                  flag = OPTIONAL_PROVIDER_FLAGS.get(provider)
                  if flag and os.environ.get(flag, "") in {"", "false"} and result["status"] == "missing" and needs_records[f"live_{provider.lower()}"]["result"] == "skipped":
                      result["status"] = "skipped"
                  expected_result = {"pass": "success", "fail": "failure"}.get(result["status"], result["status"])
                  if needs_records[f"live_{provider.lower()}"]["result"] != expected_result:
                      raise EvidenceError("job API and dependency result disagree")
              outcomes = summary_providers(
                  records,
                  {provider.lower(): "success" if result["status"] == "pass" else result["status"] for provider, result in provider_jobs.items()},
                  {provider.lower(): os.environ.get(flag, "") for provider, flag in OPTIONAL_PROVIDER_FLAGS.items()},
                  candidate=candidate, run_id=os.environ["GITHUB_RUN_ID"], run_attempt=str(current_attempt),
                  job_attempts={provider.lower(): str(result.get("run_attempt", current_attempt)) for provider, result in provider_jobs.items()},
              )
              provider_results_ok = all(result["accepted"] for result in outcomes.values())
          except (EvidenceError, ValueError, KeyError, TypeError):
              provider_configuration_ok = False
              outcomes = {}
          for provider, result in provider_jobs.items():
              primary = provider in {"OpenAI", "Anthropic"}
              outcome = outcomes.get(provider.lower(), {"status": "missing"})
              policy = "required" if primary else "supplemental"
              scope = "Protected representative hosted check" if primary else "Supplemental hosted evidence"
              provider_rows.append(("Live provider", provider, policy, {**result, "status": outcome["status"]}, scope))

          catalog_ok = True
          try:
              canary_repository, canary_revision, canary_platform_count, official_count = read_catalog()
          except (OSError, ValueError, TypeError, tomllib.TOMLDecodeError):
              catalog_ok = False
              canary_repository = "unavailable"
              canary_revision = ""
              canary_platform_count = 0
              official_count = None

          catalog_url = (
              f"https://github.com/{repository}/blob/{candidate}/.github/package-qualification-catalog.toml"
              if candidate_valid
              else run_url
          )
          if catalog_ok:
              canary_url = f"https://github.com/{canary_repository}/tree/{canary_revision}"
              canary_scope = (
                  f"[{canary_repository}@{canary_revision[:12]}]({canary_url}); "
                  f"{canary_platform_count} platforms"
              )
          else:
              canary_scope = "Qualification catalog unavailable or invalid"
              package = {
                  "status": "missing",
                  "completed": package["completed"],
                  "evidence": package["evidence"],
              }

          if official_count == 0:
              official = {
                  "status": "skipped",
                  "completed": "—",
                  "evidence": f"[Catalog: 0 registered]({catalog_url})",
              }
              official_scope = "No registered official packages"
          elif isinstance(official_count, int) and official_count > 0:
              official = {
                  "status": "missing",
                  "completed": "—",
                  "evidence": f"[Catalog: {official_count} registered]({catalog_url})",
              }
              official_scope = f"{official_count} registered; aggregate results required"
          else:
              official = {
                  "status": "missing",
                  "completed": "—",
                  "evidence": f"[Qualification catalog]({catalog_url})",
              }
              official_scope = "Registered count unavailable"

          rows = [
              ("Product", "CLI and workflow conformance", "required", deterministic, "Ubuntu, macOS, Windows; shared deterministic family"),
              ("Product", "Deterministic provider adapters", "required", deterministic, "6 adapters on Ubuntu, macOS, Windows"),
              ("Product", "Maintained content", "required", deterministic, "Checked-in examples and definitions on the deterministic family"),
              ("Package", "Public qualification canary lifecycle", "required", package, canary_scope),
              ("Package", "Registered official packages", "conditional", official, official_scope),
          ]
          rows.extend(provider_rows)

          required_results = [
              result["status"]
              for _, _, policy, result, _ in rows
              if policy.startswith("required")
          ]
          family_results_ok = all(
              os.environ.get(name) == "success"
              for name in ("DETERMINISTIC_RESULT", "PACKAGE_RESULT")
          )
          official_results_ok = official["status"] in {"pass", "skipped"}
          qualified = (
              candidate_valid
              and trigger_valid
              and jobs_api_ok
              and catalog_ok
              and family_results_ok
              and provider_configuration_ok
              and provider_results_ok
              and official_results_ok
              and all(status == "pass" for status in required_results)
          )

          lines = [
              "## Cargo AI Product Qualification",
              "",
              "> ✅ **Product Qualification: Passed**"
              if qualified
              else "> ❌ **BLOCKED** — at least one required result failed, was cancelled, skipped, or is missing.",
              "",
              f"- Candidate: [{candidate_display}]({candidate_url})",
              f"- Workflow run: [#{os.environ['GITHUB_RUN_NUMBER']} (attempt {os.environ['GITHUB_RUN_ATTEMPT']})]({run_url})",
              f"- Generated: `{generated_at}`",
              "",
              "| Direction | Check | Policy | Status | Scope | Completed (UTC) | Evidence |",
              "| --- | --- | --- | --- | --- | --- | --- |",
          ]
          primary_rows = [row for row in rows if row[2] != "supplemental"]
          supplemental_rows = [row for row in rows if row[2] == "supplemental"]
          for direction, check, policy, result, scope in primary_rows:
              lines.append(
                  "| "
                  + " | ".join(
                      table_cell(value)
                      for value in (
                          direction,
                          check,
                          policy,
                          STATUS_LABELS[result["status"]],
                          scope,
                          result["completed"],
                          result["evidence"],
                      )
                  )
                  + " |"
              )
          lines.extend([
              "", "<details>", "<summary>Supplemental provider details</summary>", "",
              "| Provider | Result | Evidence |", "| --- | --- | --- |",
          ])
          for _, provider, _, result, _ in supplemental_rows:
              lines.append("| " + " | ".join(table_cell(value) for value in (provider, STATUS_LABELS[result["status"]], result["evidence"])) + " |")
          lines.extend(["", "</details>", ""])
          lines.extend(
              [
                  "JUnit and provenance artifacts remain the durable evidence. This summary contains no provider credentials or raw provider responses.",
              ]
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

          if not qualified:
              sys.exit("product qualification is blocked")
          PY
