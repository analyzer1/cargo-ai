[package]
name = "cargo-ai"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Build lightweight AI agents with Cargo. Powered by Rust. Declared in JSON."
repository = "https://github.com/analyzer1/cargo-ai"
homepage = "https://cargo-ai.org"
readme = "README.md"
keywords = ["ai", "agents", "automation", "llm", "cli"]
categories = [
    "command-line-utilities",
    "development-tools",
    "development-tools::build-utils",
]
build = "build.rs"

[[example]]
name = "qualification-gate"
path = "tests/support/qualification_gate.rs"

# Streaming cache inventories must not spend the test budget in debug SHA rounds.
[profile.test.package.sha2]
opt-level = 3

[features]
default = ["developer-tools"]
developer-tools = []

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
clap = "4.5.35"
dirs = "6.0.0"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
futures = "0.3.31"
jsonlogic = "0.5.1"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "blocking", "rustls-tls"] }
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semver = "1.0.26"
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
tar = "0.4.44"
time = { version = "0.3.41", default-features = false, features = ["formatting", "std"] }
tokio = { version = "1.44.1", features = ["full"] }
toml = "0.9.8"
uuid = { version = "1.21.0", default-features = false, features = ["std", "v4", "v7"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }

[dev-dependencies]
mockito = "1.7.0"
time = { version = "0.3.41", default-features = false, features = ["formatting", "std"] }

[build-dependencies]
serde_json = "1.0"
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
time = { version = "0.3.41", default-features = false, features = ["formatting", "std"] }
uuid = { version = "1.21.0", default-features = false, features = ["std", "v4"] }
